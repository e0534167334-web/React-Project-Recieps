# הגדרות פריסה ל־Render (Blueprint).
# מסד הנתונים נמצא אצל ספק נפרד (למשל Supabase), ולכן אין כאן מסד נתונים של Render.
services:
  - type: web
    name: recipe-sharing-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    # מריץ Migrations, מכין קטגוריות וחשבון מנהל (בלי לשכפל), ומפעיל את השרת
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # מדביקים ידנית: ה־Session pooler של Supabase
      - key: JWT_SECRET
        generateValue: true # Render יוצר מפתח אקראי וארוך
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGINS
        sync: false # כתובת אתר ה־React, למשל https://my-recipes.netlify.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: recipe-images
      - key: AI_API_KEY
        sync: false
